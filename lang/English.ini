; Language elements for Rank Field module

; Module metadata
name = "Rank Field"
description = "Converts a series of selected text entry fields on a survey page into a drag-and-drop rank order field. Rank order is then stored in each field's value."

; Action tag description
rank_description = "Converts a series of selected text entry fields on a survey page into a drag-and-drop rank order field. Rank order is then stored in each field's value. Must be placed on a descriptive text field. Takes a list of fields to be converted to rankable options using the simplified syntax <code>@RANK=field1,field2,field3,field4,field5</code>.<br/><br/>Advanced usage: Parameter is a JSON object that takes options <code>fields</code>: a comma-separated list of text input fields to rank, <code>min</code>: minimum number of fields to include in ranking (optional), <code>max</code>: maximum number of fields to include in ranking (optional), and <code>message</code>: where <code>false</code> suppresses the default message about how many items need to be ranked (optional; default = <code>true</code>).<br/><br/>Full example: <code>@RANK={\"fields\":\"field1,field2,field3,field4,field5\",\"min\":2,\"max\":5,\"message\":false}</code>."

; {0} and {1} are positional arguments
msg_all = "Please rank all options"
msg_exact = "Please rank exactly {0} options"
msg_none = "There are no options to rank"
msg_min = "Please rank at least {0} options"
msg_max = "Please rank at most {0} options"
msg_min_max = "Please rank at least {0} and at most {1} options"
rank_pane_header = "Your Ranking"
source_pane_header = "Available Options"

